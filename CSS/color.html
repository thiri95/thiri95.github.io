<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            margin: 30px;
            padding: 100px;
            border: 1px solid black;
            text-align: center;
        }

        .color1 {
            color: red;
            background-color: #12df75;
        }

        .color2 {
            background-color: rgb(133,76,245);
        }

        .color3 {
            background-color: rgba(208,37, 98, 0.45);
        }
    </style>
</head>
<body>
    <div class="color1">Color1</div>
    <div class="color2">Color2</div>
    <div class="color3">Color3</div>
</body>
</html>
